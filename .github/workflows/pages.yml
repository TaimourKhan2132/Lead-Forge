name: pages

# Rebuilds the live page from main and publishes it to the gh-pages branch, which GitHub Pages serves.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    name: build and publish the page
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt -r requirements-dev.txt

      # Filled from the committed example, the linter's real output and the tracker's own rules.
      - name: Build the page
        run: python docs/make_site.py --check

      # One commit, replaced on every publish and attributed to whoever pushed.
      - name: Publish to gh-pages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish the live page from ${GITHUB_SHA::7}"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
