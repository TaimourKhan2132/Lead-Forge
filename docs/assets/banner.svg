<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-labelledby="t d">
  <title id="t">LeadForge</title>
  <desc id="d">Lead research that only says what it can prove. Three claims are confirmed with a tick and one, which cannot be proven, is struck out.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111a2e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.18" cy="0.1" r="0.9">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.20"/>
      <stop offset="0.45" stop-color="#f59e0b" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.1" fill="#ffffff" fill-opacity="0.055"/>
    </pattern>
    <clipPath id="card"><rect width="1280" height="420" rx="26"/></clipPath>
    <style>
      .sans { font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace; }
      .tick { stroke-dasharray: 26; stroke-dashoffset: 26; animation: draw 12s ease-out infinite; }
      .t1 { animation-delay: .6s } .t2 { animation-delay: 1.5s } .t3 { animation-delay: 2.4s }
      .strike { stroke-dasharray: 330; stroke-dashoffset: 330; animation: cut 12s ease-out infinite; animation-delay: 3.6s; }
      .tag { opacity: 0; animation: show 12s ease-out infinite; animation-delay: 4.4s; }
      .row4 { animation: fade 12s ease-out infinite; animation-delay: 3.6s; }
      @keyframes draw { 0% { stroke-dashoffset: 26 } 5%, 92% { stroke-dashoffset: 0 } 100% { stroke-dashoffset: 26 } }
      @keyframes cut  { 0% { stroke-dashoffset: 330 } 6%, 90% { stroke-dashoffset: 0 } 100% { stroke-dashoffset: 330 } }
      @keyframes show { 0% { opacity: 0 } 5%, 88% { opacity: 1 } 100% { opacity: 0 } }
      @keyframes fade { 0% { opacity: 1 } 6%, 90% { opacity: .5 } 100% { opacity: 1 } }
      @media (prefers-reduced-motion: reduce) {
        .tick, .strike { animation: none; stroke-dashoffset: 0 } .tag { animation: none; opacity: 1 } .row4 { animation: none; opacity: .5 }
      }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1280" height="420" fill="url(#bg)"/>
    <rect width="1280" height="420" fill="url(#dots)"/>
    <rect width="1280" height="420" fill="url(#glow)"/>
    <rect x="0" y="0" width="6" height="420" fill="url(#ink)"/>
  </g>
  <rect x="0.5" y="0.5" width="1279" height="419" rx="26" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

  <!-- left: the name and the promise -->
  <g transform="translate(76 96)">
    <path d="M17 0 L21.5 12.5 L34 17 L21.5 21.5 L17 34 L12.5 21.5 L0 17 L12.5 12.5 Z" fill="url(#ink)"/>
    <text class="sans" x="50" y="24" font-size="15" font-weight="600" letter-spacing="3.2" fill="#fbbf24">LEAD RESEARCH PIPELINE</text>
    <text class="sans" x="-4" y="122" font-size="92" font-weight="700" letter-spacing="-2.5" fill="#f8fafc">LeadForge</text>
    <text class="sans" x="0" y="176" font-size="27" font-weight="400" fill="#cbd5e1">Lead research that only says</text>
    <text class="sans" x="0" y="212" font-size="27" font-weight="600" fill="#f8fafc">what it can prove.</text>
    <g class="mono" font-size="14" fill="#94a3b8">
      <text x="0" y="266">discover</text>
      <text x="84" y="266" fill="#475569">→</text>
      <text x="108" y="266">qualify</text>
      <text x="184" y="266" fill="#475569">→</text>
      <text x="208" y="266" fill="#fbbf24">verify in a browser</text>
      <text x="380" y="266" fill="#475569">→</text>
      <text x="404" y="266">pack</text>
      <text x="452" y="266" fill="#475569">→</text>
      <text x="476" y="266">draft</text>
    </g>
  </g>

  <!-- right: a claim sheet -->
  <g transform="translate(760 66)">
    <rect width="446" height="288" rx="16" fill="#0f172a" stroke="#ffffff" stroke-opacity="0.10"/>
    <rect width="446" height="44" rx="16" fill="#ffffff" fill-opacity="0.035"/>
    <circle cx="24" cy="22" r="5" fill="#ef4444" fill-opacity="0.75"/>
    <circle cx="42" cy="22" r="5" fill="#f59e0b" fill-opacity="0.75"/>
    <circle cx="60" cy="22" r="5" fill="#22c55e" fill-opacity="0.75"/>
    <text class="mono" x="88" y="27" font-size="13" fill="#94a3b8">claims · checked in a browser today</text>

    <g class="mono" font-size="15.5">
      <g transform="translate(26 82)">
        <circle cx="10" cy="-5" r="11" fill="#10b981" fill-opacity="0.14"/>
        <path class="tick t1" d="M4 -5 L8.6 -0.4 L16.4 -9.6" fill="none" stroke="#34d399" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="36" y="0" fill="#e2e8f0">no website on its Google listing</text>
      </g>
      <g transform="translate(26 132)">
        <circle cx="10" cy="-5" r="11" fill="#10b981" fill-opacity="0.14"/>
        <path class="tick t2" d="M4 -5 L8.6 -0.4 L16.4 -9.6" fill="none" stroke="#34d399" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="36" y="0" fill="#e2e8f0">footer still says 2018</text>
      </g>
      <g transform="translate(26 182)">
        <circle cx="10" cy="-5" r="11" fill="#10b981" fill-opacity="0.14"/>
        <path class="tick t3" d="M4 -5 L8.6 -0.4 L16.4 -9.6" fill="none" stroke="#34d399" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="36" y="0" fill="#e2e8f0">its https address fails to load</text>
      </g>
      <g transform="translate(26 232)">
        <circle cx="10" cy="-5" r="11" fill="#ef4444" fill-opacity="0.14"/>
        <path d="M5 -10 L15 0 M15 -10 L5 0" fill="none" stroke="#f87171" stroke-width="2.2" stroke-linecap="round"/>
        <text class="row4" x="36" y="0" fill="#e2e8f0">"no booking system on its site"</text>
        <path class="strike" d="M34 -5 L330 -5" stroke="#f87171" stroke-width="2" stroke-linecap="round"/>
        <g class="tag">
          <rect x="342" y="-19" width="74" height="26" rx="13" fill="#ef4444" fill-opacity="0.16" stroke="#f87171" stroke-opacity="0.5"/>
          <text x="379" y="-1.5" font-size="12.5" text-anchor="middle" fill="#fca5a5">retired</text>
        </g>
      </g>
    </g>
  </g>
</svg>
